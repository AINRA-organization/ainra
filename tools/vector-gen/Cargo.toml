# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "ainra-vector-gen"
description = "Deterministic generator + replay checker for the CC0 conformance vectors (vectors/v1). Emits real signed credentials + the expected verdict for every closed reason; the corpus is what sdk-ts and the P0 CLI are diffed against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ainra-vector-gen"
path = "src/main.rs"

[dependencies]
ainra-core = { path = "../../crates/ainra-core" }
ainra-adapter = { path = "../../crates/ainra-adapter" }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std", "raw_value"] }
rand_core = { workspace = true }
base64ct = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }
k256 = { workspace = true }
p256 = { workspace = true }
# D-112: the RSA SIGNING side of the RS256/PS256 link vectors (the verifiers use the rsa crate and their own
# libraries). Plain modular exponentiation with fixed test keys and a salt derived from the message, so every
# signature, PSS included, is reproducible byte for byte. Generator only; never on a verify path.
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
rand_chacha = { version = "0.3", default-features = false }
